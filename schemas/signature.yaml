$schema: https://json-schema.org/draft/2020-12/schema
$id: loopship://schemas/signature.yaml
title: Loopship Integrity Manifest
type: object
oneOf:
  - $ref: "#/$defs/legacy_v2"
  - $ref: "#/$defs/digest_v3"
$defs:
  sha256:
    type: string
    pattern: "^[a-f0-9]{64}$"
  root:
    type: object
    additionalProperties: false
    required:
      - path
      - schema
      - digest
    properties:
      path:
        const: .loopship/system.yaml
      schema:
        const: loopship://schemas/system.yaml
      digest:
        $ref: "#/$defs/sha256"
  entries:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - path
        - schema
        - role
        - digest
      properties:
        resource_ref:
          $ref: loopship://schemas/system.yaml#/$defs/resource_ref
        path:
          type: string
          minLength: 1
        schema:
          type: string
          minLength: 1
          pattern: "^(self|loopship://schemas/[a-z0-9._/-]+\\.yaml)$"
        role:
          enum:
            - canonical
            - generated
        digest:
          $ref: "#/$defs/sha256"
  previous_receipt_head:
    type:
      - string
      - "null"
    pattern: "^[a-f0-9]{64}$"
  legacy_v2:
    type: object
    additionalProperties: false
    required:
      - schema_version
      - canonicalization
      - hash_algorithm
      - root
      - entries
      - receipt_head
      - signed_at
      - signer
      - signature
    properties:
      schema_version:
        const: 2
      canonicalization:
        const: loopship-canonical-json-v1
      hash_algorithm:
        const: sha256
      root:
        $ref: "#/$defs/root"
      entries:
        $ref: "#/$defs/entries"
      previous_receipt_head:
        $ref: "#/$defs/previous_receipt_head"
      receipt_head:
        $ref: "#/$defs/sha256"
      signed_at:
        type: string
        format: date-time
      signer:
        const: system_update
      signature:
        type: object
        additionalProperties: false
        required:
          - algorithm
          - key_id
          - value
        properties:
          algorithm:
            const: ed25519
          key_id:
            type: string
            minLength: 1
          value:
            type: string
            minLength: 1
  digest_v3:
    type: object
    additionalProperties: false
    required:
      - schema_version
      - canonicalization
      - hash_algorithm
      - root
      - entries
      - receipt_head
      - generated_at
      - generated_by
    properties:
      schema_version:
        const: 3
      canonicalization:
        const: loopship-canonical-json-v1
      hash_algorithm:
        const: sha256
      root:
        $ref: "#/$defs/root"
      entries:
        $ref: "#/$defs/entries"
      previous_receipt_head:
        $ref: "#/$defs/previous_receipt_head"
      receipt_head:
        $ref: "#/$defs/sha256"
      generated_at:
        type: string
        format: date-time
      generated_by:
        const: system_update
